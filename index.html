<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="theme-color" content="#030712" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Astral Attendance | Premium Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
        --bg-color: #f8fafc;
        --text-color: #0f172a;
        --panel-bg: rgba(255, 255, 255, 0.8);
        --panel-border: rgba(0, 0, 0, 0.1);
        --accent-color: #0891b2;
      }
      
      .dark {
        --bg-color: #030712;
        --text-color: #f8fafc;
        --panel-bg: rgba(17, 24, 39, 0.7);
        --panel-border: rgba(255, 255, 255, 0.08);
        --accent-color: #22d3ee;
      }

      body {
        font-family: 'Outfit', sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        overflow-x: hidden;
        -webkit-tap-highlight-color: transparent;
        transition: background-color 0.5s cubic-bezier(0.4, 0, 0.2, 1), color 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Space Grotesk', sans-serif;
      }
      .glass-panel {
        background: var(--panel-bg);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid var(--panel-border);
        transition: backdrop-filter 0.3s ease, background 0.3s ease, border-color 0.3s ease;
      }
      /* Performance Mode Overrides */
      .perf-mode .glass-panel {
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        background: var(--panel-bg);
        opacity: 0.98;
      }
      .dark.perf-mode .glass-panel {
        background: rgba(15, 23, 42, 0.95);
      }
      .perf-mode .animate-pulse {
        animation: none !important;
      }
      .perf-mode * {
        text-shadow: none !important;
      }

      .neon-glow {
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.15);
      }
      .dark .neon-glow {
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      }
      .perf-mode .neon-glow {
        box-shadow: none !important;
        border-color: var(--accent-color);
      }

      /* Hide scrollbar for smooth feel */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: var(--bg-color);
      }
      ::-webkit-scrollbar-thumb {
        background: #334155;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569;
      }
      
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Fix for iOS momentum scrolling */
      .scroll-container {
        -webkit-overflow-scrolling: touch;
      }

      /* Prevent text size adjustment after orientation change */
      html {
        -webkit-text-size-adjust: 100%;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",

    "prop-types": "https://esm.sh/prop-types@15.8.1",

  }
}
</script>
