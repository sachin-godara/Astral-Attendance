<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Subtle obsidian with top illumination -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1c20" />
      <stop offset="60%" stop-color="#0e0e11" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    
    <!-- Crisp Outer Border Stroke -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.28)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.06)" />
    </linearGradient>

    <!-- Star Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base with smooth rounded corners -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Ambient Glow -->
  <circle cx="32" cy="27" r="18" fill="url(#starGlow)" />

  <!-- Graduation Cap Top (Diamond) -->
  <path d="M32 15 L53 26 L32 37 L11 26 Z" fill="#ffffff" />

  <!-- Subtle shadow / dimension on right half of mortarboard -->
  <path d="M32 15 L53 26 L32 37 Z" fill="#ebebee" />

  <!-- Center Astral Four-Pointed Star Emblem -->
  <path d="M32 21 C32 24.2 33.8 26 36.8 26 C33.8 26 32 27.8 32 31 C32 27.8 30.2 26 27.2 26 C30.2 26 32 24.2 32 21 Z" fill="#09090b" />

  <!-- Cap Base Curve -->
  <path d="M19.5 31.5 V37.5 C19.5 43.5 44.5 43.5 44.5 37.5 V31.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Tassel with sleek drop -->
  <path d="M51 26 L51.5 37.5 C51.5 39 50 40 49 41" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" />
  <circle cx="49" cy="42" r="1.5" fill="#ffffff" />

  <!-- Floating North Astral Star Sparkle (Top-Left Accent) -->
  <path d="M14 11 C14 12.5 14.8 13.5 16 13.5 C14.8 13.5 14 14.5 14 16 C14 14.5 13.2 13.5 12 13.5 C13.2 13.5 14 12.5 14 11 Z" fill="#ffffff" opacity="0.9" />
</svg>
